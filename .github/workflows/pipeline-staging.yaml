name: Pipeline Staging

defaults:
    run:
        working-directory: ./serverless

on:
    push:
        branches:
            - "staging*"
        paths:
            - "serverless/**"
            - .github/workflows/pipeline-staging.yaml
    pull_request:
        paths:
            - "serverless/**"
            - .github/workflows/pipeline-staging.yaml

env:
    PIPELINE_USER_ACCESS_KEY_ID: ${{ secrets.PIPELINE_USER_ACCESS_KEY_ID }}
    PIPELINE_USER_SECRET_ACCESS_KEY: ${{ secrets.PIPELINE_USER_SECRET_ACCESS_KEY }}
    SAM_TEMPLATE: template.yaml
    STAGING_STACK_NAME: andreadiotalleviart
    STAGING_PIPELINE_EXECUTION_ROLE: ${{ secrets.STAGING_PIPELINE_EXECUTION_ROLE }}
    STAGING_CLOUDFORMATION_EXECUTION_ROLE: ${{ secrets.STAGING_CLOUDFORMATION_EXECUTION_ROLE }}
    STAGING_ARTIFACTS_BUCKET: aws-sam-cli-managed-staging-pipel-artifactsbucket-1571mu0d2n3o
    STAGING_REGION: eu-west-2
    NETLIFY_BUILD_HOOK_STAGING: ${{ secrets.NETLIFY_BUILD_HOOK_STAGING }}
    NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            serverless: ${{ steps.filter.outputs.serverless }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # PR merge commits obscure the tip push; check the branch tip instead.
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 2
            - id: filter
              run: |
                  if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                    base_ref="HEAD^"
                  elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                    base_ref="${{ github.event.before }}"
                    git fetch --depth=1 origin "$base_ref"
                  else
                    base_ref="${{ github.event.pull_request.base.sha }}"
                    git fetch --depth=1 origin "$base_ref"
                  fi
                  echo "Diffing $base_ref..HEAD"
                  git diff --name-only "$base_ref" HEAD
                  if git diff --name-only "$base_ref" HEAD | grep -qE '^serverless/'; then
                    echo "serverless=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "serverless=false" >> "$GITHUB_OUTPUT"
                  fi

    test:
        needs: [changes]
        if: needs.changes.outputs.serverless == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: |
                  # trigger the tests here

    build-and-deploy-staging:
        needs: [changes, test]
        if: needs.changes.outputs.serverless == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: aws-actions/setup-sam@v3
              with:
                  use-installer: true
            - run: sam build --template ${SAM_TEMPLATE} --use-container

            - name: Assume the staging pipeline user role
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ env.PIPELINE_USER_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ env.PIPELINE_USER_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.STAGING_REGION }}
                  role-to-assume: ${{ env.STAGING_PIPELINE_EXECUTION_ROLE }}
                  role-session-name: staging-deployment
                  role-duration-seconds: 3600
                  role-skip-session-tagging: true

            - name: Deploy to staging stack in the staging account
              shell: bash
              run: |
                  sam deploy --stack-name ${STAGING_STACK_NAME} \
                    --parameter-overrides Environment=staging \
                    --capabilities CAPABILITY_IAM \
                    --region ${STAGING_REGION} \
                    --s3-bucket ${STAGING_ARTIFACTS_BUCKET} \
                    --no-fail-on-empty-changeset \
                    --role-arn ${STAGING_CLOUDFORMATION_EXECUTION_ROLE}
            - name: Sync Stripe products (staging)
              run: |
                  aws lambda invoke \
                    --region ${STAGING_REGION} \
                    --function-name ${STAGING_STACK_NAME}-StripeSynchroniseProducts \
                    --payload '{}' \
                    --log-type Tail \
                    --query 'LogResult' \
                    --output text \
                    /dev/null | base64 --decode
            - name: Trigger Netlify deploy (staging)
              if: ${{ env.NETLIFY_BUILD_HOOK_STAGING != '' }}
              run: |
                  echo "Triggering Netlify build hook for staging..."
                  curl -s -X POST "${{ env.NETLIFY_BUILD_HOOK_STAGING }}" || exit 1

            - name: Trigger Netlify deploy preview (PR branch)
              if: ${{ github.event_name == 'pull_request' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
              run: |
                  echo "Triggering Netlify build for PR branch ${GITHUB_HEAD_REF}..."
                  response="$(curl -sS -w "\n%{http_code}" -X POST \
                    "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds" \
                    -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "{\"branch\":\"${GITHUB_HEAD_REF}\"}")"
                  http_code="$(echo "$response" | tail -n1)"
                  body="$(echo "$response" | sed '$d')"
                  echo "$body"
                  if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                    echo "Netlify API returned HTTP ${http_code}"
                    exit 1
                  fi
